name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Terraform CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/terraform-ci.yml@98ef67a92a659c1b4633279961ed2bc704a506e2
    with:
      working-directory: '.'
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
